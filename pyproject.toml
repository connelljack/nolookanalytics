[project]
name = "nolookanalytics"
version = "0.1.0"
description = "NBA shot analytics pipeline and visualization"
requires-python = ">=3.11"

dependencies = [
    "nba_api>=1.4.1",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "ipython",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
